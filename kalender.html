<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Layanan Publik - Palopo</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/main.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="p-4 max-w-4xl mx-auto bg-slate-50">
  <h1 class="text-2xl font-extrabold text-brand-navy mb-4 flex items-center gap-2">
    <i class="fa-regular fa-calendar text-brand-cyan"></i> Kalender Layanan Publik Palopo
  </h1>
  
  <div id="calendar" class="bg-white rounded-2xl shadow p-4"></div>

  <div class="mt-4 text-xs text-slate-500 flex flex-wrap gap-4 justify-center">
    <span><span class="inline-block w-3 h-3 rounded-full bg-amber-500 mr-1"></span> Posyandu</span>
    <span><span class="inline-block w-3 h-3 rounded-full bg-emerald-500 mr-1"></span> Pelayanan Dinas</span>
    <span><span class="inline-block w-3 h-3 rounded-full bg-rose-500 mr-1"></span> Bansos / Sosial</span>
    <span><span class="inline-block w-3 h-3 rounded-full bg-sky-500 mr-1"></span> Kesehatan</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      
      // Data statis (bisa diambil dari Google Sheets nanti)
      const events = [
        { title: 'Posyandu Balita - Wara', start: '2026-09-07', color: '#f59e0b' },
        { title: 'Posyandu Lansia - Mungkajang', start: '2026-09-08', color: '#f59e0b' },
        { title: 'Layanan KTP Keliling - Kecamatan Bara', start: '2026-09-09', color: '#10b981' },
        { title: 'Pencairan Bansos PKH', start: '2026-09-10', color: '#ef4444' },
        { title: 'Vaksinasi Rabies - Puskesmas Pontap', start: '2026-09-11', color: '#0ea5e9' },
        { title: 'Sosialisasi NIB UMKM - DPMPTSP', start: '2026-09-12', color: '#10b981' },
        { title: 'Posyandu - Sendana', start: '2026-09-14', color: '#f59e0b' },
        { title: 'Pemeriksaan Kesehatan Gratis - RSUD Sawerigading', start: '2026-09-15', color: '#0ea5e9' },
      ];

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        events: events,
        height: 'auto',
        eventClick: function(info) {
          alert(`📅 ${info.event.title}\n📌 ${info.event.startStr}`);
        }
      });
      calendar.render();
    });
  </script>
</body>
</html>
